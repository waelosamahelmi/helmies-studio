function renderMonolith(){const p=page();const index=APP.pages.indexOf(p)+1;return `<div class="app theme-monolith"><div class="mono-shell"><aside class="mono-mast"><span class="brand-glyph">${icon('mark')}</span><div class="mono-word">HELMIES</div><div class="mono-index">STUDIO / ${String(index).padStart(2,'0')} OF 24</div></aside><section class="mono-body"><header class="mono-top"><div><div class="eyebrow">Creative instrument ${String(index).padStart(2,'0')}</div><h1>${p.label}</h1></div><div class="mono-meta"><span class="tiny">${p.desc}</span>${credit()}<button class="btn" data-command>${icon('search')} Index</button></div></header><main class="mono-page">${renderPage(p)}</main><nav class="mono-menu">${APP.pages.map((x,i)=>`<button data-page="${x.id}" class="${APP.state.page===x.id?'active':''}"><span>${String(i+1).padStart(2,'0')}</span><span>${x.label}</span></button>`).join('')}</nav></section></div>${conceptBar()}${overlays()}</div>`}
function renderUniverse(){const p=page();const quick=['agent','image','video','director','canvas','assets','workflows','settings'];return `<div class="app theme-universe"><div class="uni-shell"><header class="uni-top">${logo()}<button class="uni-search" data-command>${icon('search')} <span>Ask Helmies or launch any creative instrument</span><span class="mono" style="margin-left:auto">CTRL K</span></button><div class="uni-top-actions">${credit()}<button class="btn icon-only small" data-page="settings">${icon('user')}</button></div></header><nav class="uni-orbit">${quick.map(id=>{const x=APP.pages.find(p=>p.id===id);return `<button data-page="${id}" class="${APP.state.page===id?'active':''}">${icon(x.icon)}<span>${x.label}</span></button>`}).join('')}</nav><main class="uni-page">${renderPage(p)}</main><div class="uni-recents" aria-label="Recent assets">${APP.assets.slice(0,5).map(a=>`<button data-page="assets" title="${a.name}" style="background-image:url('${a.src}')"></button>`).join('')}</div></div>${conceptBar()}${overlays()}</div>`}
function overlays(){let html='';if(APP.state.modal==='command'){const q=APP.state.query.toLowerCase();const list=APP.pages.filter(p=>p.label.toLowerCase().includes(q)||p.desc.toLowerCase().includes(q)).slice(0,9);html+=`<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-label="Command palette" onclick="event.stopPropagation()"><div class="panel-title"><div><div class="eyebrow">Navigate Studio</div><h2>Command palette</h2></div><button class="btn icon-only" data-close-modal>${icon('close')}</button></div><input class="command-input" data-command-input autofocus placeholder="Search tools and actions" value="${APP.state.query}"><div class="command-results">${list.map(p=>`<button class="command-item" data-page="${p.id}">${icon(p.icon)}<span><strong>${p.label}</strong><br><small class="muted">${p.desc}</small></span></button>`).join('')}</div></section></div>`}if(APP.state.modal==='upload')html+=`<div class="modal-backdrop" data-close-modal><section class="modal" role="dialog" aria-modal="true" aria-label="Add media" onclick="event.stopPropagation()"><div class="panel-title"><div><div class="eyebrow">Source media</div><h2>Add to your generation</h2></div><button class="btn icon-only" data-close-modal>${icon('close')}</button></div><button class="drop" style="min-height:120px" data-action="device-upload">${icon('upload')} Choose a file from this device</button><div class="panel-title" style="margin-top:18px"><h3>Recent assets</h3></div><div class="media-grid" style="grid-template-columns:repeat(3,1fr)">${APP.assets.slice(0,6).map(a=>`<article class="media-card" data-pick-asset="${a.id}"><img src="${a.src}" alt="${a.name}"><div class="media-card-body"><h3>${a.name}</h3></div></article>`).join('')}</div></section></div>`;if(APP.state.toast)html+=`<div class="notice" role="status">${APP.state.toast}</div>`;return html}
function initGenerationCanvas(){cancelAnimationFrame(APP.canvasFrame);const canvas=document.getElementById('generationCanvas');if(!canvas)return;const ctx=canvas.getContext('2d');const host=canvas.parentElement;const dpr=Math.min(devicePixelRatio||1,2);const rect=host.getBoundingClientRect();canvas.width=Math.max(1,rect.width*dpr);canvas.height=Math.max(1,rect.height*dpr);ctx.scale(dpr,dpr);const w=rect.width,h=rect.height,cx=w/2,cy=h/2;const accent=getComputedStyle(document.querySelector('.app')).getPropertyValue('--accent').trim()||'#ff416f';const count=Math.max(38,Math.min(90,Math.floor(w/12)));const particles=Array.from({length:count},(_,i)=>({angle:i/count*Math.PI*2,radius:80+(i*47)%Math.max(100,Math.min(w,h)*.43),speed:.00015+(i%7)*.000018,size:1+(i%4)*.45,phase:(i*1.73)%6.28}));let start=performance.now();function frame(now){ctx.clearRect(0,0,w,h);const t=now-start;ctx.save();ctx.translate(cx,cy);for(let ring=0;ring<4;ring++){ctx.beginPath();ctx.arc(0,0,74+ring*42+Math.sin(t*.001+ring)*5,0,Math.PI*2);ctx.strokeStyle=`${accent}${['42','2b','20','14'][ring]}`;ctx.lineWidth=1;ctx.setLineDash([2+ring*2,8+ring*4]);ctx.lineDashOffset=-t*.006*(ring%2?1:-1);ctx.stroke()}ctx.setLineDash([]);particles.forEach((p,i)=>{const a=p.angle+t*p.speed*(i%2?1:-1);const breathe=Math.sin(t*.0015+p.phase)*12;const r=p.radius+breathe;const x=Math.cos(a)*r,y=Math.sin(a)*r;const pull=Math.max(0,1-r/Math.max(w,h));ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x*.58,y*.58);ctx.strokeStyle=`${accent}${i%3===0?'34':'13'}`;ctx.stroke();ctx.beginPath();ctx.arc(x,y,p.size+pull*2,0,Math.PI*2);ctx.fillStyle=i%5===0?'#ffffff':accent;ctx.globalAlpha=.35+(Math.sin(t*.002+p.phase)+1)*.25;ctx.fill();ctx.globalAlpha=1});const pulse=48+Math.sin(t*.003)*10;const glow=ctx.createRadialGradient(0,0,3,0,0,pulse);glow.addColorStop(0,'#ffffff');glow.addColorStop(.12,accent);glow.addColorStop(1,'transparent');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,pulse,0,Math.PI*2);ctx.fill();ctx.restore();APP.canvasFrame=requestAnimationFrame(frame)}APP.canvasFrame=requestAnimationFrame(frame)}
function render(){const fn={obsidian:renderObsidian,atelier:renderAtelier,signal:renderSignal,spatial:renderSpatial,filmstrip:renderFilmstrip,modular:renderModular,monolith:renderMonolith,universe:renderUniverse}[APP.state.theme]||renderObsidian;document.getElementById('root').innerHTML=fn();setTimeout(()=>{document.querySelector('[autofocus]')?.focus();initGenerationCanvas()},0)}
function toast(message){APP.state.toast=message;render();clearTimeout(APP.toastTimer);APP.toastTimer=setTimeout(()=>{APP.state.toast='';render()},1800)}
function generate(){if(APP.state.generating){cancelGeneration();return}APP.state.generating=true;APP.state.result=false;APP.state.progress=8;APP.state.stage='Preparing request';render();const steps=[[24,'Submitting to provider'],[49,'Generating composition'],[72,'Resolving fine detail'],[89,'Running quality check'],[100,'Finalizing asset']];let i=0;APP.genTimer=setInterval(()=>{if(i>=steps.length){clearInterval(APP.genTimer);setTimeout(()=>{APP.state.generating=false;APP.state.result=true;APP.state.stage='Ready';render();toast('Generation completed and saved to Assets')},500);return}APP.state.progress=steps[i][0];APP.state.stage=steps[i][1];i++;render()},700)}
function cancelGeneration(){clearInterval(APP.genTimer);APP.state.generating=false;APP.state.progress=0;APP.state.stage='Ready';render();toast('Generation cancelled. Reserved credits released')}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-pick-asset]');if(!b)return;if(b.dataset.theme){APP.state.theme=b.dataset.theme;sessionStorage.setItem('hs-theme',APP.state.theme);render();return}if(b.dataset.page){APP.state.page=b.dataset.page;APP.state.result=false;APP.state.modal='';render();return}if(b.dataset.mode){APP.state.mode=b.dataset.mode;render();return}if(b.dataset.model){APP.state.model=b.dataset.model;render();return}if(b.dataset.ratio){APP.state.ratio=b.dataset.ratio;render();return}if(b.dataset.quality){APP.state.quality=b.dataset.quality;render();return}if(b.dataset.duration){APP.state.duration=+b.dataset.duration;render();return}if(b.dataset.asset){APP.state.selectedAssets.has(b.dataset.asset)?APP.state.selectedAssets.delete(b.dataset.asset):APP.state.selectedAssets.add(b.dataset.asset);render();return}if(b.dataset.generate!==undefined){generate();return}if(b.dataset.cancel!==undefined){cancelGeneration();return}if(b.dataset.command!==undefined){APP.state.modal='command';APP.state.query='';render();return}if(b.dataset.upload!==undefined){APP.state.modal='upload';render();return}if(b.dataset.closeModal!==undefined||b.dataset.closeModal===''){APP.state.modal='';render();return}if(b.dataset.inspector!==undefined){APP.state.inspector=!APP.state.inspector;render();return}if(b.dataset.pickAsset){APP.state.selectedAssets.add(b.dataset.pickAsset);APP.state.modal='';render();toast('Reference added to generation');return}if(b.dataset.action){const actions={enhance:'Prompt refined with cinematic detail',surprise:'Art direction loaded into the prompt',download:'Asset prepared for download',canvas:'Asset sent to Canvas',reference:'Result added as a reference',new:'New generation ready',save:'Changes saved',sync:'Provider pricing synchronized',fingerprint:'Brand fingerprint refreshed',plan:'Production plan prepared for review',execute:'Approved shots added to the execution queue','save-preset':'Generation preset saved','new-brand':'New brand kit created','new-project':'New project created','api-key':'New API key created','device-upload':'File picker opened',history:'Run history opened',more:'Asset actions opened'};if(b.dataset.action==='new'){APP.state.result=false;render()}else toast(actions[b.dataset.action]||'Action completed')}});
document.addEventListener('input',e=>{if(e.target.matches('[data-command-input]')){APP.state.query=e.target.value;render()}if(e.target.matches('[data-range]'))e.target.nextElementSibling.textContent=(+e.target.value).toFixed(1)});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();APP.state.modal='command';APP.state.query='';render()}if(e.key==='Escape'&&APP.state.modal){APP.state.modal='';render()}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!APP.state.modal){e.preventDefault();generate()}});
render();
</script>
