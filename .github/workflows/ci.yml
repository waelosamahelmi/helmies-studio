name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ci-only-secret
          NEXTAUTH_URL: http://localhost:3000

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npx prisma generate
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  e2e:
    runs-on: ubuntu-latest
    services:
      # Playwright's webServer entries (playwright.config.mjs) hardcode
      # DATABASE_URL to postgresql://postgres:test@localhost:55432/test (the
      # same disposable-container shape local dev uses, `helmies-test-pg`) —
      # not read from ambient env — so this service's user/password/db and
      # the 55432 host port below must match exactly, or the spawned `next
      # start` / worker child processes simply can't connect.
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:55432/test
      # Phase 8 Task B2 — the browser matrix (chromium, firefox, webkit;
      # playwright.config.mjs's three projects all depend on the same
      # "setup" project, so this one `npm run test:e2e` invocation runs
      # every spec on all three engines without a build-matrix job).
      - run: npx playwright install --with-deps chromium firefox webkit
      # EDITSv1 E4.4: video assembly shells out to ffmpeg (src/lib/video-assembly.js).
      # Production has it (6.1.1); this runner image does not, so the timeline
      # re-assemble journey failed with `spawn ffmpeg ENOENT`. Install it rather
      # than skipping the test — assembly is a real product capability and the
      # trim/transition argument building deserves to be exercised end to end.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -version | head -1
      # Mirrors playwright.config.mjs's webServerEnv (the app/worker
      # webServer entries hardcode these same values regardless of this
      # step's env, but setting them here keeps this job an accurate,
      # self-documenting picture of what the webServer needs, and covers
      # anything the config might one day read from ambient env instead).
      # DATABASE_URL resolving to hostname "localhost" is also what lets
      # scripts/worker.mjs's E2E_MOCK_PROVIDERS=1 (workerServerEnv) pass
      # src/lib/providers.js's E2E_MOCK_PROVIDERS hostname lock — without
      # it the worker would try to reach a real provider with no key and
      # every generation job would hang/fail instead of using the fixture.
      # NODE_ENV=production is scoped to ONLY this step (not job-level):
      # setting it job-wide would make `npm ci` above silently skip every
      # devDependency (@playwright/test included) — confirmed empirically
      # before writing this job, see the Task 5 commit's evidence.
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:55432/test
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:55432/test
          NEXTAUTH_URL: http://localhost:3399
          NEXTAUTH_SECRET: e2e-test-secret-do-not-use-in-production-0000
          GOOGLE_CLIENT_ID: e2e-dummy-google-client-id
          GOOGLE_CLIENT_SECRET: e2e-dummy-google-client-secret
          KIE_KEY: e2e-dummy-kie-key
          WEBHOOK_SECRET: e2e-dummy-webhook-secret
          OPENROUTER_KEY: ""
          ALIBABA_KEY: ""
          ALIBABA_WORKSPACE_ID: ""
          STRIPE_SECRET_KEY: e2e-dummy-stripe-secret-not-a-real-key
          STRIPE_WEBHOOK_SECRET: e2e-dummy-stripe-webhook-not-a-real-key
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: e2e-dummy-stripe-publishable-not-a-real-key
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Documented acceptance (Task 12, 2026-08-01): `npm audit fix` already applied
      # everything within our existing semver ranges — next-auth 5.0.0-beta.31→.32,
      # prisma 7.8.0→7.9.1, next 16.2.10→16.2.12 — which cleared the critical
      # (@auth/core) and moderate (@hono/node-server, valibot) findings.
      # 3 high-severity findings remain, all nested exclusively inside next's own
      # node_modules (next/node_modules/postcss <=8.5.17 — GHSA-qx2v-qp2m-jg93 and
      # related; sharp <0.35.0 — GHSA-f88m-g3jw-g9cj, libvips CVEs), with no
      # upstream fix on the next 16.x line: `npm view next dist-tags` shows
      # latest=16.2.12 (what we already have), and the only newer builds are
      # 16.3.0 canary/preview — not a stable release we can adopt. `npm audit fix
      # --force` would downgrade next to 9.3.3, which is not a real fix. Level
      # narrowed to critical until next ships a stable release with these bundled
      # deps patched, or bundles a fixed sharp/postcss internally. Re-widen to
      # `high` at that point. Recorded in
      # .superpowers/sdd/2026-08-01-phase1-foundation-stabilization/progress.md.
      - run: npm audit --omit=dev --audit-level=critical
