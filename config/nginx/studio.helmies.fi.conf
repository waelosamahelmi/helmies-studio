server {
    server_name studio.helmies.fi;

    # Dev Terminal (ttyd on port 3090) — inject transparency CSS
    location /dev-terminal {
        proxy_pass http://127.0.0.1:3090/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '</head>' '<style>body{background:transparent!important}.xterm-viewport,.xterm-screen,.xterm{background:transparent!important}body>div{background:rgba(5,5,18,0.2)!important}</style><script>setInterval(function(){document.querySelectorAll(".xterm-viewport,.xterm-screen,.xterm").forEach(function(e){e.style.backgroundColor="transparent"})},500)</script></head>';
    }

    # Dev Opencode (opencode web on port 3095)
    location /dev-opencode {
        proxy_pass http://127.0.0.1:3095/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Everything -> Helmies Studio (port 3010)
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        client_max_body_size 500M;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/nginx/ssl/studio.helmies.fi.crt;
    ssl_certificate_key /etc/nginx/ssl/studio.helmies.fi.key;
}

server {
    if ($host = studio.helmies.fi) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name studio.helmies.fi;
    return 404;
}
